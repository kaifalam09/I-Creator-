name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build I-Creator APK
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2. Setup Java
      # ------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ------------------------------------------------------
      # 3. Setup Flutter
      # ------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ------------------------------------------------------
      # 4. Show Flutter version
      # ------------------------------------------------------
      - name: Flutter Doctor
        run: |
          flutter --version
          flutter doctor -v

      # ------------------------------------------------------
      # 5. Create Android/Flutter project
      # ------------------------------------------------------
      - name: Create Flutter Project
        run: |
          flutter create \
            --org com.bharatstream.app \
            --project-name i_creator \
            build_project

      # ------------------------------------------------------
      # 6. Copy application files
      # ------------------------------------------------------
      - name: Copy App Files
        run: |
          cp pubspec.yaml build_project/pubspec.yaml
          cp lib/main.dart build_project/lib/main.dart

      # ------------------------------------------------------
      # 7. Get dependencies
      # ------------------------------------------------------
      - name: Flutter Pub Get
        working-directory: build_project
        run: |
          flutter clean
          flutter pub get

      # ------------------------------------------------------
      # 8. Analyze Dart code
      # ------------------------------------------------------
      - name: Analyze Flutter Code
        working-directory: build_project
        run: |
          flutter analyze

      # ------------------------------------------------------
      # 9. Build Release APK
      # ------------------------------------------------------
      - name: Build Release APK
        working-directory: build_project
        run: |
          flutter build apk --release --no-tree-shake-icons

      # ------------------------------------------------------
      # 10. Upload APK
      # ------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: I-Creator-App
          path: build_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
