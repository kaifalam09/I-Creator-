name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0'

      - name: Initialize Project
        run: |
          flutter create --org com.bharatstream.app --project-name i_creator my_app
          cd my_app
          rm -f pubspec.yaml lib/main.dart

      - name: Checkout Repo Files
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Build APK File
        run: |
          cp repo/pubspec.yaml my_app/pubspec.yaml
          cp repo/lib/main.dart my_app/lib/main.dart
          cd my_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: my_app/build/app/outputs/flutter-apk/app-release.apk
