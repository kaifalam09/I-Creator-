name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true

      - name: Create Flutter Project
        run: |
          flutter create \
            --org com.icreator.app \
            --project-name i_creator \
            build_project

      - name: Copy App Files
        run: |
          cp pubspec.yaml build_project/pubspec.yaml
          cp lib/main.dart build_project/lib/main.dart

      - name: Get Dependencies
        working-directory: build_project
        run: flutter pub get

      - name: Analyze Flutter Project
        working-directory: build_project
        run: flutter analyze

      - name: Build APK
        working-directory: build_project
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: I-Creator-App
          path: build_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
